<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The OBBYs — Live Awards</title>
<style>
  :root{
    --ink:#08070a;
    --ink-2:#120d10;
    --gold:#d4af6a;
    --gold-bright:#f2cf8e;
    --carpet:#9c1c26;
    --carpet-deep:#5c0f16;
    --carpet-hi:#c9313c;
    --cream:#f3e6d0;
    --cream-dim:#cbb99e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  body{
    height: 100vh;
    background:
      radial-gradient(ellipse 1100px 700px at 50% -10%, rgba(212,175,106,0.10), transparent 60%),
      radial-gradient(ellipse 1400px 900px at 50% 115%, rgba(156,28,38,0.16), transparent 60%),
      var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--cream);
    display: flex;
  }

  .show{
    position: relative;
    width: 100%;
    height: 100vh;
    max-width: none;
  }

  /* ---------- Header ---------- */
  .head{
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 3;
    text-align: center;
    padding: 26px 16px 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .head.revealed{ opacity: 1; }
  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 0 0 10px;
  }
  .show-title{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1;
    margin: 0;
    letter-spacing: 0.01em;
    background: linear-gradient(180deg, var(--gold-bright) 10%, var(--gold) 55%, #a97f3d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(242,207,142,0.3);
  }

  .progress{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
    margin-top: 24px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
  .dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(212,175,106,0.25);
    transition: background 0.3s ease, transform 0.3s ease;
    flex-shrink: 0;
  }
  .dot.active{
    background: var(--gold-bright);
    transform: scale(1.3);
  }
  .dot.done{
    background: var(--carpet-hi);
  }

  /* ---------- Stage (fills remaining viewport, edge to edge) ---------- */
  .stage{
    position: absolute;
    inset: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    padding: 132px 56px 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage::before{
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 500px 300px at 50% 0%, rgba(242,207,142,0.12), transparent 65%);
    pointer-events: none;
  }

  .beam{
    position: absolute;
    top: -10px;
    width: 0;
    height: 0;
    border-style: solid;
    mix-blend-mode: screen;
    opacity: 0.3;
    transform-origin: top center;
    pointer-events: none;
    animation: sway 6s ease-in-out infinite alternate;
  }
  .beam.l{
    left: 6%;
    border-width: 0 90px 520px 90px;
    border-color: transparent transparent rgba(255,244,214,0.4) transparent;
  }
  .beam.r{
    right: 6%;
    border-width: 0 90px 520px 90px;
    border-color: transparent transparent rgba(255,244,214,0.4) transparent;
    animation-delay: -3s;
    animation-name: sway-r;
  }
  @keyframes sway{ from{ transform: rotate(-20deg); } to{ transform: rotate(6deg); } }
  @keyframes sway-r{ from{ transform: rotate(20deg); } to{ transform: rotate(-6deg); } }

  /* ---------- Panels (mutually exclusive) ---------- */
  .panel{
    position: relative;
    width: 100%;
    display: none;
    text-align: center;
  }
  .panel.active{ display: block; }

  /* ---- Intro panel ---- */
  #introPanel.active{
    animation: fade-up 0.5s ease both;
  }
  .intro-eyebrow{
    font-size: 15px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 0 0 22px;
  }
  .intro-name{
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 58px;
    margin: 0 0 42px;
    color: var(--gold-bright);
    text-shadow: 0 0 30px rgba(242,207,142,0.35);
    text-wrap: balance;
  }

  /* ---- Nominees panel ---- */
  .category-label{
    margin-bottom: 40px;
  }
  .category-eyebrow{
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 0 0 10px;
  }
  .category-name{
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 40px;
    margin: 0;
    color: var(--gold-bright);
    text-wrap: balance;
  }

  .nominees{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    perspective: 1200px;
  }
  .nominee{
    background: linear-gradient(180deg, rgba(212,175,106,0.06), transparent);
    border: 1px solid rgba(212,175,106,0.22);
    border-radius: 10px;
    padding: 30px 16px;
    text-align: center;
    opacity: 0;
    transform-style: preserve-3d;
    transform-origin: center;
    backface-visibility: hidden;
    transform: rotateY(-100deg);
    animation: nominee-flip 1.9s cubic-bezier(.3,.15,.15,1) forwards;
  }
  @keyframes nominee-flip{
    0%{ opacity: 0; transform: rotateY(-100deg); }
    55%{ opacity: 1; }
    100%{ opacity: 1; transform: rotateY(0deg); }
  }
  .nominee-photos{
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }
  .nominee-photo{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    background: #1a1512;
    display: block;
  }
  .nominee-photos.duo .nominee-photo:first-child{
    margin-right: -22px;
    position: relative;
    z-index: 1;
  }
  .nominee-name{
    font-family: Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--cream);
    margin: 0 0 4px;
  }
  /* ---- Act break panel ---- */
  #actPanel.active{
    animation: fade-up 0.6s ease both;
  }
  .act-label{
    font-size: 16px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 18px;
  }
  .act-name{
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 64px;
    margin: 0 0 8px;
    color: var(--gold-bright);
    text-shadow: 0 0 40px rgba(242,207,142,0.4);
    text-wrap: balance;
  }

  /* ---- Suspense panel ---- */
  .envelope{
    position: relative;
    width: 130px;
    height: 90px;
    margin: 0 auto 30px;
  }
  .envelope-body{
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #2a2220, #171212);
    border: 1px solid var(--gold);
    border-radius: 5px;
  }
  .envelope-flap{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    border-style: solid;
    border-width: 45px 65px 0 65px;
    border-color: var(--gold) transparent transparent transparent;
    transform-origin: top center;
    transition: transform 0.6s cubic-bezier(.4,0,.2,1);
  }
  .envelope.shake{ animation: shake 0.5s ease-in-out infinite; }
  .envelope.open .envelope-flap{ transform: rotateX(180deg); }
  @keyframes shake{
    0%, 100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-3deg); }
    75%{ transform: rotate(3deg); }
  }
  .suspense-text{
    font-size: 16px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream-dim);
  }
  .suspense-text .dots span{
    animation: blink 1.2s infinite;
    opacity: 0.2;
  }
  .suspense-text .dots span:nth-child(2){ animation-delay: 0.2s; }
  .suspense-text .dots span:nth-child(3){ animation-delay: 0.4s; }
  @keyframes blink{
    0%, 100%{ opacity: 0.2; }
    50%{ opacity: 1; }
  }

  /* ---- Winner panel ---- */
  #winnerPanel.active{
    animation: winner-in 0.6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes winner-in{
    from{ opacity: 0; transform: scale(0.85) translateY(10px); }
    to{ opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fade-up{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .winner-trophy{
    font-size: 52px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 20px rgba(242,207,142,0.6));
  }
  .winner-photos{
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 24px;
  }
  .winner-photo{
    width: 156px;
    height: 156px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--gold-bright);
    background: #1a1512;
    box-shadow: 0 0 0 8px rgba(242,207,142,0.12), 0 0 50px rgba(242,207,142,0.35);
  }
  .winner-eyebrow{
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 0 0 14px;
  }
  .winner-name{
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 52px;
    margin: 0 0 16px;
    color: var(--gold-bright);
    text-shadow: 0 0 30px rgba(242,207,142,0.45);
    text-wrap: balance;
  }
  .winner-why{
    max-width: 560px;
    margin: 0 auto;
    font-size: 18px;
    color: var(--cream-dim);
    line-height: 1.55;
    font-style: italic;
  }

  /* ---------- Confetti ---------- */
  .confetti{
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti span{
    position: absolute;
    top: -10%;
    width: 9px;
    height: 15px;
    opacity: 0;
    border-radius: 1px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    0%{ opacity: 1; transform: translateY(0) rotate(0deg); }
    100%{ opacity: 0.9; transform: translateY(780px) rotate(600deg); }
  }

  /* ---------- Outro ---------- */
  #outroPanel h2{
    font-family: Georgia, serif;
    font-size: 44px;
    color: var(--gold-bright);
    margin: 0 0 16px;
  }
  #outroPanel p{
    color: var(--cream-dim);
    font-size: 18px;
  }

  /* ---------- Controls ---------- */
  .controls{
    margin-top: 44px;
  }
  .btn{
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 18px 44px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241b12;
    box-shadow: 0 10px 24px -10px rgba(212,175,106,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(212,175,106,0.75); }
  .btn:active{ transform: translateY(0); }

  /* ---- Cold open: Trophy Forge (Three.js) ---- */
  #openerPanel.active{
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .forge-canvas-wrap{
    position: absolute;
    inset: 0;
    z-index: 0;
    background: #050406;
  }
  .forge-canvas-wrap canvas{
    width: 100%;
    height: 100%;
    display: block;
  }
  .forge-canvas-wrap.gone{ display: none; }

  /* during the cold open the stage beams stay dark — the void is pure */
  .stage.opener .beam{ opacity: 0; }
  .stage.opener::before{ opacity: 0; }

  #openerPanel.active{
    min-height: clamp(460px, 68vh, 720px);
    justify-content: flex-end;
  }
  #openerControls{
    margin-top: 8px;
    position: relative;
    z-index: 2;
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  @media (max-width: 720px){
    .stage{ padding: 112px 24px 24px; }
    .nominees{ grid-template-columns: 1fr; }
    .show-title{ font-size: 36px; }
    .category-name, .intro-name{ font-size: 28px; }
    .winner-name{ font-size: 34px; }
    .winner-photo{ width: 110px; height: 110px; }
    .nominee-photo{ width: 72px; height: 72px; }
  }

  @media (prefers-reduced-motion: reduce){
    .beam, .envelope.shake, .nominee, #introPanel.active, #winnerPanel.active{ animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div class="show">
  <div class="head">
    <p class="eyebrow">The OBBYs Present</p>
    <h1 class="show-title">Live Awards</h1>
    <div class="progress" id="progress"></div>
  </div>

  <div class="stage opener" id="stage">
    <div class="forge-canvas-wrap" id="forgeWrap">
      <canvas id="forgeCanvas"></canvas>
    </div>
    <div class="beam l"></div>
    <div class="beam r"></div>
    <div class="confetti" id="confetti"></div>

    <!-- Cold open: Trophy Forge (Three.js) -->
    <div class="panel active" id="openerPanel">
      <div class="controls" id="openerControls">
        <button class="btn" id="beginForgeBtn">Begin</button>
        <button class="btn" id="enterShowBtn" style="display:none;">Enter The OBBYs</button>
      </div>
    </div>

    <!-- Beat 1: category announced -->
    <div class="panel" id="introPanel">
      <p class="intro-eyebrow">Up Next — Category <span id="introNum">1</span> of <span id="introTotal">17</span></p>
      <h2 class="intro-name" id="introName">The Golden Boot Award</h2>
      <div class="controls">
        <button class="btn" id="revealNomineesBtn">Reveal Nominees</button>
      </div>
    </div>

    <!-- Beat 2: nominees -->
    <div class="panel" id="nomineesPanel">
      <div class="category-label">
        <p class="category-eyebrow">Category <span id="catNum">1</span> of <span id="catTotal">17</span></p>
        <h2 class="category-name" id="catName">The Golden Boot Award</h2>
      </div>
      <div class="nominees" id="nomineesGrid"></div>
      <div class="controls">
        <button class="btn" id="revealBtn">Open the Envelope</button>
      </div>
    </div>

    <!-- Act break bumper -->
    <div class="panel" id="actPanel">
      <p class="act-label" id="actLabel">Act I</p>
      <h2 class="act-name" id="actName">Red Carpet Arrival</h2>
      <div class="controls">
        <button class="btn" id="actContinueBtn">Continue</button>
      </div>
    </div>

    <!-- Beat 3a: suspense -->
    <div class="panel" id="suspensePanel">
      <div class="envelope" id="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
      </div>
      <p class="suspense-text">And the winner is<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>

    <!-- Beat 3b: winner -->
    <div class="panel" id="winnerPanel">
      <div class="winner-trophy">🏆</div>
      <div class="winner-photos" id="winnerPhotos"></div>
      <p class="winner-eyebrow" id="winnerCatName">The Golden Boot Award</p>
      <h2 class="winner-name" id="winnerName">[NAME]</h2>
      <p class="winner-why" id="winnerWhy">[WHY THEY WON]</p>
      <div class="controls">
        <button class="btn" id="nextBtn">Next Category</button>
      </div>
    </div>

    <!-- Outro -->
    <div class="panel" id="outroPanel">
      <h2>That's a Wrap</h2>
      <p>Nineteen legends. Seventeen awards. See you next month.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
  const P = "nominees/";
  const people = {
    anup:       { name: "Anup",      file: P + "anup.jpg" },
    ranjith:    { name: "Ranjith",   file: P + "ranjith.png" },
    anshuman:   { name: "Anshuman",  file: P + "anshuman.jpg" },
    maitrey:    { name: "Maitrey",   file: P + "maitrey.jpg" },
    omkar:      { name: "Omkar",     file: P + "omkar.png" },
    spruha:     { name: "Spruha",    file: P + "spruha.jpg" },
    jayant:     { name: "Jayant",    file: P + "jayant.png" },
    anil:       { name: "Anil",      file: P + "anil.jpg" },
    rishikesh:  { name: "Rishikesh", file: P + "rishikesh.jpg" },
    sunil:      { name: "Sunil",     file: P + "sunil.png" },
    shweta:     { name: "Shweta",    file: P + "shweta.jpg" },
    guna:       { name: "Guna",      file: P + "guna.png" },
    murali:     { name: "Murali",    file: P + "murali.jpg" },
    manjunath:  { name: "Manjunath", file: P + "manjunath.jpg" },
    ritu:       { name: "Ritu",      file: P + "ritu.png" },
    sweety:     { name: "Sweety",    file: P + "sweety.jpg" },
    haresh:     { name: "Haresh",    file: P + "haresh.png" },
    sashi:      { name: "Sashi",     file: P + "sashi.jpg" },
    ravi:       { name: "Ravi",      file: P + "ravi.jpg" }
  };

  function one(key, blurb){ return { members: [people[key]], blurb }; }
  function two(key1, key2, blurb){ return { members: [people[key1], people[key2]], blurb }; }

  const categories = [
    // ---- ACT I: Red Carpet Arrival ----
    {
      act: 1,
      title: "The Golden Boot Award",
      nominees: [
        one("anup", "Captain energy, every single match"),
        one("ranjith", "Surprisingly deadly free-kick taker"),
        one("anshuman", "All heart, occasionally offside")
      ],
      winner: { members: [people.anup], why: "Doesn't need to be on the pitch to know exactly what went wrong with that offside call. Peak fan energy, zero playing time." }
    },
    {
      act: 1,
      title: "Best Costume Design Award",
      nominees: [
        one("shweta", "Dressed for the awards before the invite went out"),
        one("maitrey", "Effortless, annoyingly so"),
        one("ravi", "Best dressed, worst kept secret")
      ],
      winner: { members: [people.ravi], why: "Dresses like the meeting was actually important. We appreciate the effort." }
    },
    {
      act: 1,
      title: "The Michelin Star Award",
      nominees: [
        one("omkar", "The potluck MVP, every time"),
        one("spruha", "Secretly hoards the good recipes"),
        one("sunil", "Brings the dish everyone fights over")
      ],
      winner: { members: [people.omkar, people.sunil], why: "Two people, one kitchen rivalry, zero survivors at the potluck table." }
    },
    {
      act: 1,
      title: "Best Cinematography Award",
      nominees: [
        one("maitrey", "Finds the shot nobody else sees"),
        one("ranjith", "Secretly a wildlife photographer at heart"),
        one("omkar", "Candid king of the group chat")
      ],
      winner: { members: [people.ranjith], why: "Turns out the real talent was never the group chat candids — it's the birds. Camera always ready, patience always unmatched." }
    },

    // ---- ACT II: The Main Event ----
    {
      act: 2,
      title: "The Powerhouse Award",
      nominees: [
        one("rishikesh", "Knows the gym's opening hours by heart"),
        one("jayant", "Protein shake in hand, always"),
        one("sunil", "PRs before most people wake up")
      ],
      winner: { members: [people.jayant], why: "Has opinions about your protein intake and isn't wrong. Respect the grind." }
    },
    {
      act: 2,
      title: "Best Production Design Award",
      nominees: [
        one("shweta", "Doodles that outshine the deck"),
        one("guna", "Quiet talent, loud output"),
        one("murali", "Turns whiteboards into galleries")
      ],
      winner: { members: [people.shweta], why: "Doodles better in the margins of a meeting notebook than most people do on purpose." }
    },
    {
      act: 2,
      title: "Best Ensemble Cast Award",
      nominees: [
        one("maitrey", "Good at everything, humble about it"),
        one("murali", "The Swiss army knife of the team"),
        one("ritu", "Does it all, makes it look easy")
      ],
      winner: { members: [people.murali], why: "Good at basically everything, which is deeply annoying for the rest of us." }
    },
    {
      act: 2,
      title: "The Rock Award",
      nominees: [
        one("sashi", "Says it'll get done. It gets done."),
        one("guna", "The quiet backbone of every project"),
        one("ravi", "Shows up, every single time")
      ],
      winner: { members: [people.sashi], why: "The person you ping at 6pm knowing it'll actually get done." }
    },
    {
      act: 2,
      title: "The Steady Hand Award",
      nominees: [
        one("rishikesh", "Nothing ever seems to faze him"),
        one("maitrey", "The human equivalent of a deep breath"),
        one("ritu", "Steady in every storm")
      ],
      winner: { members: [people.maitrey], why: "The one person in the room who never seems to panic, no matter what the deadline says." }
    },
    {
      act: 2,
      title: "Best Original Screenplay Award",
      nominees: [
        one("spruha", "Every anecdote has a plot twist"),
        one("jayant", "Makes the mundane sound epic"),

  const clamp01 = x => x < 0 ? 0 : (x > 1 ? 1 : x);
  const easeOutCubic  = x => 1 - Math.pow(1 - x, 3);

  const easeInOutCubic = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

  function makeCircleTexture(){
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.35,'rgba(255,244,214,0.85)');
    g.addColorStop(1,   'rgba(255,244,214,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }

  function makeRadialTexture(inner, mid, outer){
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0, inner);
    g.addColorStop(0.5, mid);
    g.addColorStop(1, outer);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }

  function makeLabelTexture(text){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    try { ctx.letterSpacing = '10px'; } catch(e){}
    ctx.font = '600 46px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.shadowColor = 'rgba(242,207,142,0.7)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#f3e6d0';
    ctx.fillText(text, c.width/2, c.height/2);
    return new THREE.CanvasTexture(c);
  }

  // Sample point positions from rendered text, so particles can become letterforms
  function sampleTextPoints(text, count, worldW, worldH){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = '700 150px Georgia, "Iowan Old Style", serif';
    ctx.fillText(text, c.width/2, c.height/2);

    const data = ctx.getImageData(0,0,c.width,c.height).data;
    const hits = [];
    for (let y = 0; y < c.height; y += 2){
      for (let x = 0; x < c.width; x += 2){
        if (data[(y*c.width + x)*4] > 130) hits.push(x, y);
      }
    }

    const out = new Float32Array(count*3);
    const n = hits.length / 2;
    for (let i = 0; i < count; i++){
      const j = (Math.random() * n) | 0;
      const px = hits[j*2], py = hits[j*2+1];
      out[i*3]   = (px / c.width  - 0.5) * worldW + (Math.random()-0.5)*0.03;
      out[i*3+1] = -(py / c.height - 0.5) * worldH + (Math.random()-0.5)*0.03;
      out[i*3+2] = (Math.random()-0.5) * 0.22;
    }
    return out;
  }

  // Trophy point cloud: base -> stem -> cup + handles, tagged by assembly wave
  function sampleTrophyPoint(){
    const r = Math.random();
    if (r < 0.20){                                  // base
      const th = Math.random()*Math.PI*2;
      const rad = 0.62*Math.sqrt(Math.random());
      return { x: rad*Math.cos(th), y: -0.92 + (Math.random()-0.5)*0.1, z: rad*Math.sin(th), wave: 0 };
    } else if (r < 0.28){                           // plinth
      const th = Math.random()*Math.PI*2;
      const rad = 0.34*Math.sqrt(Math.random());
      return { x: rad*Math.cos(th), y: -0.78 + Math.random()*0.12, z: rad*Math.sin(th), wave: 0 };
    } else if (r < 0.42){                           // stem
      const th = Math.random()*Math.PI*2;
      const t = Math.random();
      const rad = 0.10 + 0.05*Math.pow(1-t, 2);
      return { x: rad*Math.cos(th), y: -0.70 + t*0.78, z: rad*Math.sin(th), wave: 1 };
    } else if (r < 0.55){                           // handles
      const side = Math.random() < 0.5 ? -1 : 1;
      const a = -Math.PI*0.45 + Math.random()*Math.PI*1.25;
      const R = 0.42, tube = 0.045;
      const cx = side*0.72, cy = 0.78;
      const ta = Math.random()*Math.PI*2;
      return {
        x: cx + side*(R*Math.cos(a)) + tube*Math.cos(ta),
        y: cy + R*Math.sin(a) + tube*Math.sin(ta),
        z: tube*Math.sin(ta)*1.4,
        wave: 2
      };
    } else {                                        // cup
      const th = Math.random()*Math.PI*2;
      const t = Math.random();
      const profile = 0.30 + 0.72*Math.pow(t, 0.62);
      const y = 0.10 + t*1.05;
      const shell = 0.94 + Math.random()*0.06;
      return { x: profile*shell*Math.cos(th), y: y, z: profile*shell*Math.sin(th), wave: 2 };
    }
  }

  function initForge(){
    const N = 4500;
    const WAVE_DELAY = [0.0, 0.16, 0.34];

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(52, 16/9, 0.1, 200);

    const renderer = new THREE.WebGLRenderer({ canvas: forgeCanvas, antialias: true, alpha: true, premultipliedAlpha: false });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Optional bloom — falls back to direct render if the CDN passes didn't load
    let composer = null, bloomPass = null;
    const hasBloom = !!(THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass);

    function sizeAll(){
      const w = forgeCanvas.clientWidth || 800;
      const h = forgeCanvas.clientHeight || 500;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (composer) composer.setSize(w, h);
    }

    if (hasBloom){
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(forgeCanvas.clientWidth || 800, forgeCanvas.clientHeight || 500),
        0.72, 0.5, 0.26
      );
      composer.addPass(bloomPass);
    }
    sizeAll();
    window.addEventListener('resize', sizeAll);

    scene.add(new THREE.AmbientLight(0x241b12, 1.2));
    const keyLight = new THREE.PointLight(0xf2cf8e, 2.4, 40); keyLight.position.set(3.5, 4.5, 5); scene.add(keyLight);
    const rimLight = new THREE.PointLight(0xd4af6a, 1.6, 40); rimLight.position.set(-4, -1.5, 3.5); scene.add(rimLight);

    // ---- Particle field ----
    const dust      = new Float32Array(N*3);
    const trophy    = new Float32Array(N*3);
    const exploded  = new Float32Array(N*3);
    const positions = new Float32Array(N*3);
    const colors    = new Float32Array(N*3);
    const baseHue   = new Float32Array(N*3);
    const distC     = new Float32Array(N);
    const waveOf    = new Float32Array(N);
    const jitter    = new Float32Array(N);
    const spiral    = new Float32Array(N);
    const twPhase   = new Float32Array(N);

    const text = sampleTextPoints('THE OBBYs', N, 8.8, 2.2);

    const gA = new THREE.Color(0xfff4d6);
    const gB = new THREE.Color(0xd4af6a);

    for (let i = 0; i < N; i++){
      const rr = 9 + Math.random()*9;
      const th = Math.random()*Math.PI*2;
      const ph = Math.acos(2*Math.random()-1);
      const dx = rr*Math.sin(ph)*Math.cos(th);
      const dy = rr*Math.sin(ph)*Math.sin(th)*0.7;
      // keep dust off the camera's dolly path so nothing blows out as a near-field blob
      let dz = rr*Math.cos(ph);
      if (dz > 3) dz = 6 - dz;
      dust[i*3] = dx; dust[i*3+1] = dy; dust[i*3+2] = dz;
      positions[i*3] = dx; positions[i*3+1] = dy; positions[i*3+2] = dz;
      distC[i] = Math.sqrt(dx*dx + dy*dy + dz*dz);

      const t = sampleTrophyPoint();
      trophy[i*3] = t.x; trophy[i*3+1] = t.y; trophy[i*3+2] = t.z;
      waveOf[i] = t.wave;
      jitter[i] = Math.random()*0.10;
      spiral[i] = (Math.random()*2.4 + 1.0) * (Math.random() < 0.5 ? -1 : 1);
      twPhase[i] = Math.random()*Math.PI*2;

      const len = Math.sqrt(t.x*t.x + t.y*t.y + t.z*t.z) || 1;
      const sp = 5 + Math.random()*7;
      exploded[i*3]   = t.x + (t.x/len)*sp + (Math.random()-0.5)*2.5;
      exploded[i*3+1] = t.y + (t.y/len)*sp + 1.2 + (Math.random()-0.5)*2.5;
      exploded[i*3+2] = t.z + (t.z/len)*sp + Math.random()*4.5;

      const c = gA.clone().lerp(gB, Math.random()*0.85);
      baseHue[i*3] = c.r; baseHue[i*3+1] = c.g; baseHue[i*3+2] = c.b;
      colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.085,
      vertexColors: true,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
      map: makeCircleTexture()
    });
    const points = new THREE.Points(geo, mat);
    scene.add(points);


    // ---- Core glow, flash, floor, shafts ----
    const glowTex = makeRadialTexture('rgba(255,244,214,0.95)','rgba(212,175,106,0.35)','rgba(212,175,106,0)');

    const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    coreGlow.scale.set(6,6,1);
    scene.add(coreGlow);

    const flash = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    flash.scale.set(26,26,1);
    scene.add(flash);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(16,16),
      new THREE.MeshBasicMaterial({
        map: makeRadialTexture('rgba(242,207,142,0.55)','rgba(156,28,38,0.12)','rgba(0,0,0,0)'),
        transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -1.05;
    scene.add(floor);

    const shafts = [];
    for (let s = 0; s < 2; s++){
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(1.7, 15, 40, 1, true),
        new THREE.MeshBasicMaterial({
          color: 0xfff4d6, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false
        })
      );
      cone.position.set(s === 0 ? -2.9 : 2.9, 6.0, -1.4);
      cone.rotation.z = (s === 0 ? 1 : -1) * 0.20;
      scene.add(cone);
      shafts.push(cone);
    }

    // ---- Motion trails: two lagged copies of the cloud, so fast motion streaks ----
    const trailA = new Float32Array(N*3);
    const trailB = new Float32Array(N*3);
    trailA.set(positions); trailB.set(positions);

    function makeTrail(buf, size, color, opacity){
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(buf, 3));
      const m = new THREE.PointsMaterial({
        size, color, transparent: true, opacity,
        blending: THREE.AdditiveBlending, depthWrite: false,
        sizeAttenuation: true, map: mat.map
      });
      const pts = new THREE.Points(g, m);
      scene.add(pts);
      return pts;
    }
    const trail1 = makeTrail(trailA, 0.072, 0xf2cf8e, 0.34);
    const trail2 = makeTrail(trailB, 0.060, 0xd4af6a, 0.16);

    // ---- Ambient embers drifting upward, always alive ----
    const EM = 260;
    const emPos = new Float32Array(EM*3);
    const emVel = new Float32Array(EM);
    for (let i = 0; i < EM; i++){
      emPos[i*3]   = (Math.random()-0.5)*22;
      emPos[i*3+1] = -4 + Math.random()*10;
      // keep embers well behind the camera's dolly so they never smear as near-field blobs
      emPos[i*3+2] = -11 + Math.random()*9.5;
      emVel[i] = 0.12 + Math.random()*0.42;

    const emGeo = new THREE.BufferGeometry();
    emGeo.setAttribute('position', new THREE.BufferAttribute(emPos, 3));
    const embers = new THREE.Points(emGeo, new THREE.PointsMaterial({
      size: 0.05, color: 0xd4af6a, transparent: true, opacity: 0.3,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, map: mat.map
    }));
    scene.add(embers);

    // ---- Anamorphic lens streak ----
    const streak = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    streak.scale.set(24, 0.55, 1);
    scene.add(streak);

    // ---- Wordmark support: hairline rule + subtitle ----
    const rule = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    rule.position.set(0, -0.72, 0);
    rule.scale.set(0.1, 0.07, 1);
    scene.add(rule);

    const subtitle = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeLabelTexture('OB ATM AWARDS NIGHT'), transparent: true, opacity: 0, depthWrite: false
    }));
    subtitle.position.set(0, -1.12, 0);
    subtitle.scale.set(6.4, 0.8, 1);
    scene.add(subtitle);

    // ---- Sequence state ----
    let running = false, done = false, startT = 0, ambient = 0, lastNow = 0;
    const clock = new THREE.Clock();
    const pos = geo.attributes.position.array;
    const col = geo.attributes.color.array;
    const tmp = new THREE.Color();

    function setParticle(i, x, y, z, bright, warm){
      pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
      tmp.setRGB(baseHue[i*3], baseHue[i*3+1], baseHue[i*3+2]);
      if (warm > 0) tmp.lerp(gA, warm);
      col[i*3] = tmp.r*bright; col[i*3+1] = tmp.g*bright; col[i*3+2] = tmp.b*bright;
    }

    function reset(){
      running = false; done = false;
      streak.material.opacity = 0;
      rule.material.opacity = 0; rule.scale.set(0.1, 0.07, 1);
      subtitle.material.opacity = 0;
      coreGlow.material.opacity = 0;
      flash.material.opacity = 0;
      floor.material.opacity = 0;
      shafts.forEach(s => s.material.opacity = 0);
      points.rotation.y = 0;
      camera.position.set(0, 0.2, 15);
      camera.lookAt(0, 0.1, 0);
      if (bloomPass) bloomPass.strength = 0.72;
      for (let i = 0; i < N; i++){
        setParticle(i, dust[i*3], dust[i*3+1], dust[i*3+2], 0.16, 0);
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
    }

    function frame(){
      requestAnimationFrame(frame);
      const now = clock.getElapsedTime();
      const dt = Math.min(now - lastNow, 0.05); lastNow = now;
      ambient += 0.006;

      // ambient embers drift upward the whole time
      for (let i = 0; i < EM; i++){
        emPos[i*3+1] += emVel[i]*dt;
        emPos[i*3]   += Math.sin(ambient*0.7 + i)*0.0016;
        if (emPos[i*3+1] > 6){ emPos[i*3+1] = -4.5; emPos[i*3] = (Math.random()-0.5)*22; }
      }
      emGeo.attributes.position.needsUpdate = true;

      if (!running){
        // Idle: slow drifting dust so the screen is never dead
        for (let i = 0; i < N; i++){
          const d = 0.05*Math.sin(ambient*0.8 + twPhase[i]);
          const tw = 0.13 + 0.07*Math.sin(ambient*2.2 + twPhase[i]);
          setParticle(i, dust[i*3], dust[i*3+1] + d, dust[i*3+2], tw, 0);
        }
        geo.attributes.position.needsUpdate = true;
        geo.attributes.color.needsUpdate = true;
        render();
        return;
      }

      const t = now - startT;
      let trailAmt = 0;   // trails only read when particles are actually moving

      if (t < T.voidEnd){
        // BEAT 1 — The Void: dust drifts, camera pushes in
        const k = t / T.voidEnd;
        camera.position.z = 15 - easeInOutCubic(k)*3.2;
        camera.position.y = 0.2 + Math.sin(ambient*0.5)*0.05;
        for (let i = 0; i < N; i++){
          const d = 0.05*Math.sin(ambient*0.8 + twPhase[i]);
          const tw = 0.14 + 0.08*Math.sin(ambient*2.2 + twPhase[i]);
          setParticle(i, dust[i*3], dust[i*3+1] + d, dust[i*3+2], tw, 0);
        }
        points.rotation.y += 0.0005;

      } else if (t < T.igniteEnd){
        // BEAT 2 — Ignition: shockwave sweeps out, lighting each mote as it passes
        const k = (t - T.voidEnd) / (T.igniteEnd - T.voidEnd);
        const ek = easeOutCubic(k);
        const shockR = ek * 22;

        // soft bloom that breathes in with the ignition, no hard-edged pop
        streak.material.opacity = 0.22 * smoothstep(k*1.4) * Math.max(0, 1 - k*1.3);
        streak.scale.set(10 + ek*22, 0.4, 1);
        trailAmt = 0.25;

        coreGlow.material.opacity = 0.5 * smoothstep(k*2.2) * Math.max(0, 1 - (k-0.35)*1.6);
        coreGlow.scale.setScalar(2 + ek*5);

        camera.position.z = 11.8 - ek*0.9;

        for (let i = 0; i < N; i++){
          const lit = smoothstep((shockR - distC[i]) / 2.4);
          const tw = 0.9 + 0.1*Math.sin(ambient*3 + twPhase[i]);
          const b = 0.14 + lit*(1.05*tw - 0.14);
          const d = 0.05*Math.sin(ambient*0.8 + twPhase[i]);
          setParticle(i, dust[i*3], dust[i*3+1] + d, dust[i*3+2], b, lit*0.7);
        }

      } else if (t < T.forgeEnd){
        // BEAT 3 — The Forge: spiral inward in three waves (base -> stem -> cup)
        const k = (t - T.igniteEnd) / (T.forgeEnd - T.igniteEnd);
          streak.material.opacity = 0;

        const orbit = easeInOutCubic(k);
        camera.position.x = Math.sin(orbit*Math.PI*0.75) * 3.4;
        camera.position.z = 10.9 - orbit*4.6;
        camera.position.y = 0.2 + Math.sin(orbit*Math.PI)*0.55;
        camera.lookAt(0, 0.15, 0);

        coreGlow.material.opacity = 0.30*k;
        coreGlow.scale.setScalar(3.5 + k*1.5);
        trailAmt = 1.0;

        for (let i = 0; i < N; i++){
          const delay = WAVE_DELAY[waveOf[i]] + jitter[i];
          const lk = clamp01((k - delay) / (1 - delay));
          const e = easeInOutCubic(lk);

          const x0 = dust[i*3],   y0 = dust[i*3+1],   z0 = dust[i*3+2];
          const x1 = trophy[i*3], y1 = trophy[i*3+1], z1 = trophy[i*3+2];

          let x = x0 + (x1-x0)*e;
          let y = y0 + (y1-y0)*e;
          let z = z0 + (z1-z0)*e;

          // curved approach: spiral winds up then unwinds, zero at both ends so
          // there is never a jump the instant a particle starts or finishes moving
          const a = spiral[i] * (4 * lk * (1 - lk)) * 1.5;
          const ca = Math.cos(a), sa = Math.sin(a);
          const rx = x*ca - z*sa, rz = x*sa + z*ca;
          x = rx; z = rz;

          const arrive = smoothstep(lk);
          const tw = 0.85 + 0.15*Math.sin(ambient*3 + twPhase[i]);
          const b = (0.62 + 0.62*arrive) * tw;
          setParticle(i, x, y, z, b, 1 - arrive*0.75);
        }
        points.rotation.y = 0;

      } else if (t < T.solidifyEnd){
        // BEAT 4 — Solidify: heat wash, rim sweep, floor + shafts bloom, hero orbit
        const k = (t - T.forgeEnd) / (T.solidifyEnd - T.forgeEnd);

        points.rotation.y = k * 0.9;
        camera.position.x = Math.sin(Math.PI*0.75 + k*0.7) * 3.0;
        camera.position.z = 6.3 + Math.cos(k*0.7)*0.35;
        camera.position.y = 0.75 - k*0.35;
        camera.lookAt(0, 0.15, 0);

        floor.material.opacity = 0.34 * smoothstep(k*1.4);
        shafts.forEach(s => s.material.opacity = 0.030 * smoothstep(k*1.3));
        coreGlow.material.opacity = 0.16 + 0.10*Math.sin(k*Math.PI);
        coreGlow.scale.setScalar(4.2);
        trailAmt = 0.12;

        const sweepY = -1.1 + k*1.6*2.2;      // rim-light band travelling up the form
        for (let i = 0; i < N; i++){
          const y = trophy[i*3+1];
          const band = Math.max(0, 1 - Math.abs(y - sweepY)*2.6);
          const tw = 0.88 + 0.12*Math.sin(ambient*3.4 + twPhase[i]);
          setParticle(i, trophy[i*3], y, trophy[i*3+2], (0.88 + band*0.85)*tw, band*0.8);
        }

      } else if (t < T.detonateEnd){
        // BEAT 5 — Detonation: flash, particles blast past camera, pull back
        const k = (t - T.solidifyEnd) / (T.detonateEnd - T.solidifyEnd);
        const e = easeInCubic(k);

        flash.material.opacity = Math.max(0, 1.1 * Math.pow(1 - k*2.6, 2)) * (k < 0.38 ? 1 : 0);
        if (bloomPass) bloomPass.strength = 0.72 + 1.3*Math.max(0, 1 - k*3.5);

        camera.position.x *= 0.90;
        camera.position.z = 6.3 + e*4.4;
        camera.position.y = 0.4 - e*0.2;
        camera.lookAt(0, 0.15, 0);

        // impact jolt, applied to rotation so it never accumulates on position
        const jolt = Math.max(0, 1 - k*4.5) * 0.055;
        camera.rotation.z += (Math.random()-0.5)*jolt;
        camera.rotation.x += (Math.random()-0.5)*jolt*0.6;

        streak.material.opacity = 0.85 * Math.max(0, 1 - k*3.2);
        streak.scale.set(16 + k*26, 0.5 + k*0.5, 1);
        trailAmt = 1.0;

        floor.material.opacity = 0.34 * (1-k);
        shafts.forEach(s => s.material.opacity = 0.030 * (1-k));
        coreGlow.material.opacity = 0.5 * (1-k);

        for (let i = 0; i < N; i++){
          const x = trophy[i*3]   + (exploded[i*3]   - trophy[i*3])   * e;
          const y = trophy[i*3+1] + (exploded[i*3+1] - trophy[i*3+1]) * e - 2.6*e*e;
          const z = trophy[i*3+2] + (exploded[i*3+2] - trophy[i*3+2]) * e;
          setParticle(i, x, y, z, (1.05 - 0.72*k), 0.45*(1-k));
        }
        points.rotation.y = 0;

      } else if (t < T.nameEnd){
        // BEAT 6 — The Name: the same motes reassemble into the wordmark
        const k = (t - T.detonateEnd) / (T.nameEnd - T.detonateEnd);
        const e = easeOutCubic(clamp01(k*1.85));

        flash.material.opacity = 0;
        if (bloomPass) bloomPass.strength = 0.72;

        camera.position.x *= 0.9;
        camera.position.y += (0.1 - camera.position.y)*0.08;
        camera.position.z += (9.3 - camera.position.z)*0.06;
        camera.lookAt(0, 0.1, 0);

        const shimmer = -5.2 + k*13;          // gold sweep across the letterforms
        for (let i = 0; i < N; i++){
          const x = exploded[i*3]   + (text[i*3]   - exploded[i*3])   * e;
          const y = exploded[i*3+1] + (text[i*3+1] - exploded[i*3+1]) * e;
          const z = exploded[i*3+2] + (text[i*3+2] - exploded[i*3+2]) * e;
          const band = Math.max(0, 1 - Math.abs(text[i*3] - shimmer)*1.1) * smoothstep(k*2.6);
          const tw = 0.9 + 0.1*Math.sin(ambient*2.6 + twPhase[i]);
          setParticle(i, x, y, z, (0.35 + 0.7*e + band*0.9)*tw, band*0.9);
        }

        // hairline rule draws outward, then the subtitle settles beneath it
        const rk = clamp01((k - 0.42) / 0.4);
        rule.material.opacity = 0.75 * rk;
        rule.scale.set(0.1 + easeOutCubic(rk)*5.0, 0.07, 1);
        subtitle.material.opacity = clamp01((k - 0.58) / 0.3) * 0.95;
        streak.material.opacity = 0.45 * Math.max(0, 1 - Math.abs(k - 0.25)*5);
        streak.scale.set(26, 0.45, 1);
        trailAmt = 0.85 * Math.max(0, 1 - k*1.6);

        if (!done && k > 0.62){
          done = true;
          document.querySelector('.head').classList.add('revealed');
          enterShowBtn.style.display = 'inline-block';
        }

      } else {
        // Settled: hold the wordmark, gentle twinkle
        for (let i = 0; i < N; i++){
          const tw = 0.9 + 0.1*Math.sin(ambient*2.4 + twPhase[i]);
          setParticle(i, text[i*3], text[i*3+1], text[i*3+2], 1.02*tw, 0.12);
        }
        rule.material.opacity = 0.75;
        rule.scale.set(5.1, 0.07, 1);
        subtitle.material.opacity = 0.95;
        streak.material.opacity = 0;
        camera.position.x *= 0.94;
        camera.position.y += (0.1 - camera.position.y)*0.05;
        camera.position.z += (9.3 - camera.position.z)*0.05;
        camera.lookAt(0, 0.1, 0);
      }

      trail1.material.opacity = 0.34 * trailAmt;
      trail2.material.opacity = 0.16 * trailAmt;

      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
      render();
    }

    function render(){
      if (composer) composer.render(); else renderer.render(scene, camera);
      // shift lagged copies AFTER drawing, so trails always trail
      trailB.set(trailA);
      trailA.set(pos);
      trail1.geometry.attributes.position.needsUpdate = true;
      trail2.geometry.attributes.position.needsUpdate = true;
    }

    reset();
    frame();

    return {
      play(){ reset(); running = true; startT = clock.getElapsedTime(); },
      seek(sec){ reset(); running = true; startT = clock.getElapsedTime() - sec; },
      skipToEnd(){
        reset(); running = true; startT = clock.getElapsedTime() - (T.nameEnd + 0.2);
        document.querySelector('.head').classList.add('revealed');
      }
    };
  }

  const forgeWrap = document.getElementById('forgeWrap');
  const stageEl = document.getElementById('stage');

  if (reduceMotion || typeof THREE === 'undefined'){
    document.querySelector('.head').classList.add('revealed');
    beginForgeBtn.style.display = 'none';
    enterShowBtn.style.display = 'inline-block';
    forgeWrap.classList.add('gone');
    stageEl.classList.remove('opener');
  } else {
    const forge = initForge();
    window.__forge = forge;
    beginForgeBtn.addEventListener('click', () => {
      beginForgeBtn.style.display = 'none';
      forge.play();
    });
  }

  enterShowBtn.addEventListener('click', () => {
    forgeWrap.classList.add('gone');
    stageEl.classList.remove('opener');
    goToCategory();
  });
</script>

</body>
</html>
