<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The OBBYs — Finish the Lyrics</title>
<style>
  :root{
    --ink:#08070a;
    --ink-2:#120d10;
    --gold:#d4af6a;
    --gold-bright:#f2cf8e;
    --carpet:#9c1c26;
    --carpet-deep:#5c0f16;
    --carpet-hi:#c9313c;
    --cream:#f3e6d0;
    --cream-dim:#cbb99e;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    height:100vh;
    background:
      radial-gradient(ellipse 1100px 700px at 50% -10%, rgba(212,175,106,0.10), transparent 60%),
      radial-gradient(ellipse 1400px 900px at 50% 115%, rgba(156,28,38,0.16), transparent 60%),
      var(--ink);
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .slide{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px;
  }
  .slide.active{ display:flex; animation:fade-up 0.5s ease both; }
  @keyframes fade-up{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    font-size:16px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin:0 0 8px;
  }
  .difficulty{
    display:inline-block;
    margin-bottom:34px;
    padding:6px 20px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:700;
  }
  .difficulty.easy{ background:rgba(120,190,120,0.15); color:#a8e6a8; border:1px solid rgba(120,190,120,0.4); }
  .difficulty.medium{ background:rgba(212,175,106,0.15); color:var(--gold-bright); border:1px solid rgba(212,175,106,0.4); }
  .difficulty.hard{ background:rgba(201,49,60,0.18); color:var(--carpet-hi); border:1px solid rgba(201,49,60,0.5); }

  .lyric-card{
    background:linear-gradient(180deg, rgba(212,175,106,0.06), transparent);
    border:1px solid rgba(212,175,106,0.3);
    border-radius:16px;
    padding:50px 70px;
    max-width:900px;
    min-width:640px;
  }
  .lyric-line{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:38px;
    line-height:1.5;
    color:var(--cream);
    margin:0;
  }
  .lyric-line.blank{
    color:var(--gold-bright);
    text-shadow:0 0 24px rgba(242,207,142,0.35);
    min-height:1.5em;
    border-top:1px dashed rgba(212,175,106,0.35);
    margin-top:20px;
    padding-top:20px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .lyric-line.blank.revealed{ opacity:1; transform:translateY(0); }
  .blank-dots{
    font-size:38px;
    letter-spacing:10px;
    color:var(--cream-dim);
  }

  .controls{
    margin-top:40px;
    display:flex;
    gap:18px;
  }
  .btn{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--ink);
    border:none;
    padding:16px 34px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.04em;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(212,175,106,0.25);
    transition:transform 0.15s ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn.secondary{
    background:transparent;
    color:var(--gold-bright);
    border:1px solid rgba(212,175,106,0.5);
    box-shadow:none;
  }
  .btn:disabled{ opacity:0.4; cursor:default; transform:none; }

  .reveal-info{
    margin-top:26px;
    font-size:18px;
    color:var(--cream-dim);
    font-style:italic;
    opacity:0;
    transition:opacity 0.5s ease;
  }
  .reveal-info.show{ opacity:1; }

  .nav{
    position:fixed;
    bottom:36px; left:0; right:0;
    display:flex;
    justify-content:center;
    gap:14px;
    z-index:5;
  }
  .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:rgba(212,175,106,0.25);
    transition:all 0.3s ease;
  }
  .dot.active{ background:var(--gold-bright); transform:scale(1.3); }
  .dot.done{ background:var(--carpet-hi); }

  .arrow{
    position:fixed;
    top:50%; transform:translateY(-50%);
    background:rgba(212,175,106,0.08);
    border:1px solid rgba(212,175,106,0.35);
    color:var(--gold-bright);
    width:52px; height:52px;
    border-radius:50%;
    font-size:22px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:6;
  }
  .arrow.prev{ left:28px; }
  .arrow.next{ right:28px; }

  .titlecard{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .titlecard h1{
    font-family:Georgia,serif;
    font-weight:700;
    font-size:80px;
    background:linear-gradient(180deg, var(--gold-bright) 10%, var(--gold) 55%, #a97f3d 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0 0 16px;
  }
  .titlecard p{ font-size:24px; color:var(--cream-dim); margin:0; }
</style>
</head>
<body>

  <div class="slide active" data-idx="0">
    <div class="titlecard">
      <p class="eyebrow">The OBBYs Presents</p>
      <h1>Finish the Lyrics</h1>
      <p>9 rounds. 2 lines each. You supply the rest.</p>
    </div>
  </div>

  <div class="round-slides"></div>

  <div class="slide" id="finalSlide">
    <div class="titlecard">
      <p class="eyebrow">That's a Wrap</p>
      <h1>End of Round</h1>
      <p>However many you got — you sang along more than you'll admit.</p>
    </div>
  </div>

  <div class="nav" id="nav"></div>
  <button class="arrow prev" id="prevBtn">&larr;</button>
  <button class="arrow next" id="nextBtn">&rarr;</button>

  <audio id="clipAudio"></audio>

<script>
  const rounds = [
    {
      difficulty: "easy",
      title: "Bohemian Rhapsody — Queen",
      line1: "I'm just a poor boy and nobody loves me",
      line2: "We're just a poor boy from a poor family",
      answer: "Spare him his life from this monstrosity",
      file: "music/Queen - Bohemian Rhapsody [High Definition].mp3",
      start: 168.8, duration: 6.5
    },
    {
      difficulty: "easy",
      title: "Love Story — Taylor Swift",
      line1: "Romeo, take me somewhere we can be alone",
      line2: "I'll be waiting, all there's left to do is run",
      answer: "You'll be the prince and I'll be the princess",
      file: "music/Taylor Swift - Love Story.mp3",
      start: 63.2, duration: 9.9
    },
    {
      difficulty: "easy",
      title: "Tum Hi Ho — Arijit Singh",
      line1: "Hum tere bin ab reh nahi sakte",
      line2: "Tere bina kya wajood mera",
      answer: "Tujhse juda gar ho jaayenge",
      file: "music/Tum Hi Ho (Lyrics)_Arijit Singh_Aashiqui 2_@tseries.mp3",
      start: 23.5, duration: 12.3
    },
    {
      difficulty: "easy",
      title: "I Want It That Way — Backstreet Boys",
      line1: "Ain't nothin' but a heartache",
      line2: "Tell me why",
      answer: "Ain't nothin' but a mistake",
      file: "music/Backstreet Boys - I Want It That Way (Official HD Video).mp3",
      start: 53.5, duration: 6
    },
    {
      difficulty: "medium",
      title: "Tujhe Dekha To — Kumar Sanu & Lata Mangeshkar",
      line1: "Tujhe dekha to yeh jaana sanam",
      line2: "Pyar hota hai deewana sanam",
      answer: "Ab yahan se kahan jaayein hum",
      file: "music/Tujhe Dekha Toh Song _ Dilwale Dulhania Le Jayenge _ Shah Rukh Khan, Kajol _ Lata, Kumar Sanu _ DDLJ.mp3",
      start: 79.9, duration: 9.9
    },
    {
      difficulty: "medium",
      title: "Waka Waka (This Time for Africa) — Shakira",
      line1: "You're a good soldier",
      line2: "Choosing your battles",
      answer: "Pick yourself up and dust yourself off",
      file: "music/Shakira - Waka Waka (This Time for Africa) (The Official 2010 FIFA World Cup™ Song).mp3",
      start: 33.2, duration: 3.9
    },
    {
      difficulty: "medium",
      title: "Blinding Lights — The Weeknd",
      line1: "I've been tryna call",
      line2: "I've been on my own for long enough",
      answer: "Maybe you can show me how to love, maybe",
      file: "music/The Weeknd - Blinding Lights (Lyrics).mp3",
      start: 26.7, duration: 5.6
    },
    {
      difficulty: "hard",
      title: "Lag Ja Gale — Lata Mangeshkar",
      line1: "Lag ja gale ki phir",
      line2: "Ye haseen raat ho na ho",
      answer: "Shayad phir is janam mein",
      file: "music/Lag Ja Gale Ki Phir Ye Haseen Raat Ho Na Ho Video Song _ Lata Mangeshkar _ Woh Kaun Thi Songs.mp3",
      start: 29.5, duration: 11.5
    },
    {
      difficulty: "hard",
      title: "Pehla Nasha — Udit Narayan & Sadhana Sargam",
      line1: "Pehla nasha, pehla khumaar",
      line2: "Naya pyaar hai naya intezaar",
      answer: "Kar loon main kya apna haal",
      file: "music/Pehla Nasha Pehla khumar Full HD l Udit Narayan,Sadhana sargaml Jo jeeta wohi sikandar.mp3",
      start: 47.5, duration: 11.2
    }
  ];

  const container = document.querySelector('.round-slides');
  rounds.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.idx = i + 1;
    el.innerHTML = `
      <p class="eyebrow">Round ${i + 1} of ${rounds.length}</p>
      <div class="difficulty ${r.difficulty}">${r.difficulty}</div>
      <div class="lyric-card">
        <p class="lyric-line">${r.line1}</p>
        <p class="lyric-line">${r.line2}</p>
        <p class="lyric-line blank" id="answer-${i}">${r.answer}</p>
      </div>
      <div class="controls">
        <button class="btn secondary" data-play="${i}">▶ Play Clip</button>
        <button class="btn" data-reveal="${i}">Reveal Answer</button>
      </div>
      <p class="reveal-info" id="info-${i}">${r.title}</p>
    `;
    container.appendChild(el);
  });

  const slides = Array.from(document.querySelectorAll('.slide'));
  const nav = document.getElementById('nav');
  let current = 0;

  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    nav.appendChild(d);
  });
  const dots = Array.from(nav.children);

  function show(i){
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(s => s.classList.remove('active'));
    dots.forEach(d => { d.classList.remove('active'); });
    slides[current].classList.add('active');
    dots[current].classList.add('active');
    for (let j = 0; j < current; j++) dots[j].classList.add('done');
  }

  document.getElementById('nextBtn').addEventListener('click', () => show(current + 1));
  document.getElementById('prevBtn').addEventListener('click', () => show(current - 1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') show(current + 1);
    if (e.key === 'ArrowLeft') show(current - 1);
  });

  const audioEl = document.getElementById('clipAudio');
  let stopTimer = null;

  container.addEventListener('click', (e) => {
    const playBtn = e.target.closest('[data-play]');
    const revealBtn = e.target.closest('[data-reveal]');

    if (playBtn){
      const i = Number(playBtn.dataset.play);
      const r = rounds[i];
      if (stopTimer) clearTimeout(stopTimer);
      audioEl.pause();
      audioEl.onloadedmetadata = null;

      const startPlayback = () => {
        audioEl.currentTime = r.start;
        audioEl.play();
        stopTimer = setTimeout(() => audioEl.pause(), r.duration * 1000);
      };

      if (audioEl.src === new URL(r.file, document.baseURI).href && audioEl.readyState >= 1){
        startPlayback();
      } else {
        audioEl.src = r.file;
        audioEl.onloadedmetadata = startPlayback;
        audioEl.load();
      }
    }

    if (revealBtn){
      const i = Number(revealBtn.dataset.reveal);
      document.getElementById(`answer-${i}`).classList.add('revealed');
      document.getElementById(`info-${i}`).classList.add('show');
    }
  });
</script>
</body>
</html>
