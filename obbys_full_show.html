<style>
  :root{

  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--ink); }

  .mega{
    position:absolute; inset:0;
    display:none;
  }
  .mega.active{ display:block; }
  .mega iframe{
    width:100%; height:100%;
    border:none;
    display:block;
    background:var(--ink);

    display:flex;

    opacity:0.32;
    transition:opacity 0.25s ease;
  }
  .segnav:hover{ opacity:1; }
  .segbtn{
    background:transparent;
    border:1px solid rgba(212,175,106,0.3);
    color:var(--cream-dim);
    font-size:12px;
    letter-spacing:0.04em;
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.15s ease;
  }
  .segbtn:hover{ border-color:rgba(212,175,106,0.7); color:var(--cream); }
  .segbtn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
    font-weight:700;
  }
</style>

  function b64ToUtf8(b64str){
    const binary = atob(b64str);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  const loaded = {};
  const megas = Array.from(document.querySelectorAll('.mega'));
  const segBtns = Array.from(document.querySelectorAll('.segbtn'));
  let currentSeg = 0;

  function loadSeg(i){
    if (!loaded[i]){
      const frame = document.getElementById('frame' + i);
      frame.srcdoc = b64ToUtf8(B64[i]);
      loaded[i] = true;
    }
  }

  function showSeg(i){
    currentSeg = Math.max(0, Math.min(megas.length - 1, i));
    loadSeg(currentSeg);
    megas.forEach(m => m.classList.remove('active'));
    segBtns.forEach(b => b.classList.remove('active'));
    megas[currentSeg].classList.add('active');
    segBtns[currentSeg].classList.add('active');
  }

  segBtns.forEach((btn, i) => {
    btn.addEventListener('click', () => showSeg(i));
  });

  // preload first segment immediately; lazy-load the rest on demand
  loadSeg(0);
</script>
